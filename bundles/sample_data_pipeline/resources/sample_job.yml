# Placeholder job resource - replace with the real ETL/data pipeline job definition
resources:
  jobs:
    sample_etl_job:
      name: sample_etl_job
      tasks:
        - task_key: extract_transform_load
          notebook_task:
            notebook_path: ../src/sample_notebook.py
          job_cluster_key: default_cluster
      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
