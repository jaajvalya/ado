# Dedicated CI secret scan for Required Build Validation on `main`.
# Prefer azure-pipelines-ci-pr.yml (includes this scan + lint/unit/validate).
# Keep this file if you want secret scan as a separate required check.
#
# Requires a Linux-capable agent pool (linux_x64 gitleaks binary + bash).

trigger: none

pr:
  branches:
    include:
      - main

pool:
  name: <NONPROD_AGENT_POOL> # TODO: Linux-capable non-prod pool

steps:
  - checkout: self
    fetchDepth: 0

  - script: |
      set -euo pipefail
      GITLEAKS_VERSION=8.18.4
      curl -sSL -o gitleaks.tar.gz \
        "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      tar -xzf gitleaks.tar.gz gitleaks
      chmod +x gitleaks
    displayName: Install gitleaks (linux_x64)

  - script: |
      set -euo pipefail
      ./gitleaks detect \
        --source . \
        --config .gitleaks.toml \
        --redact \
        --report-format sarif \
        --report-path $(Build.ArtifactStagingDirectory)/gitleaks-report.sarif \
        --exit-code 1
    displayName: Scan for secrets, keys, and credentials

  - publish: $(Build.ArtifactStagingDirectory)/gitleaks-report.sarif
    artifact: gitleaks-report
    condition: always()
    displayName: Publish scan report
