# CI-only pipeline: scans this repo for secrets/keys/credentials on every PR
# into main. Register this as an Azure DevOps pipeline, then wire it in as a
# REQUIRED Build Validation branch policy on `main` (Project Settings ->
# Repositories -> main -> Policies -> Build Validation). See SECRETS-POLICY.md.
#
# This is intentionally a separate pipeline from
# azure-pipelines-databricks-bundles.yml: that one uses `extends`, which locks
# its stage structure to the DevOpsBase template, so a scan step can't be
# injected into it.
#
# TODO: set pool to this org's non-prod agent pool (see PLACEHOLDER-SETUP-GUIDE.md #2)

trigger: none

pr:
  branches:
    include:
      - main

pool:
  name: <NONPROD_AGENT_POOL> # TODO: replace with actual agent pool name

steps:
  - checkout: self
    fetchDepth: 0 # full history so gitleaks can scan past commits on the PR branch, not just the tip

  - script: |
      set -e
      GITLEAKS_VERSION=8.18.4
      curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      tar -xzf gitleaks.tar.gz gitleaks
      chmod +x gitleaks
    displayName: "Install gitleaks"

  - script: |
      ./gitleaks detect \
        --source . \
        --config .gitleaks.toml \
        --redact \
        --report-format sarif \
        --report-path $(Build.ArtifactStagingDirectory)/gitleaks-report.sarif \
        --exit-code 1
    displayName: "Scan for secrets, keys, and credentials"

  - publish: $(Build.ArtifactStagingDirectory)/gitleaks-report.sarif
    artifact: gitleaks-report
    condition: always()
    displayName: "Publish scan report"
